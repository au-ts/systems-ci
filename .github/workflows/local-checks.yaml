# Actions to run in *this* repo for push/PRs.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  style_python:
    name: Style (Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: psf/black@stable
        with:
          # black guarantees formatting stability within a calendar year version
          version: "~= 25.0"

  lint_python:
    name: Lint (Python)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup mypy
        run: |
          python3 -m venv venv
          source ./venv/bin/activate
          pip install mypy==1.17
      - name: Run mypy
        run: |
          source ./venv/bin/activate
          mypy -p ts_ci

  setup_self:
    name: Setup self
    strategy:
      fail-fast: false
      matrix:
        # oldest python version we support is 3.9
        version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.x']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.version }}
      - name: Setup systems-ci
        uses: ./.
        with:
          path: systems-ci
      - name: Test import
        run: |
          python -c 'import ts_ci; print("hello")'
