[project]
name = "ts_ci"
requires-python = ">= 3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.package-dir]
ts_ci = "."

[tool.setuptools.package-data]
ts_ci = ["py.typed"]
